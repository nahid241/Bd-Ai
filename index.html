<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nn</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: auto; -webkit-overflow-scrolling: touch; }
        iframe { border: none; width: 100%; height: 100%; display: block; position: absolute; top:0; left:0; pointer-events: auto; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: sans-serif; z-index: 99999; }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <iframe id="content-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"></iframe>
    <script>
        const frame = document.getElementById('content-frame');
        const ov = document.getElementById('overlay');
        const pid = "PID-zq9tkkhmo";
        let lastCode = "";

        function sync() {
            try {
                const data = JSON.parse(localStorage.getItem('private_live_server_v12') || '[]');
                const current = data.find(i => i.id === pid);
                if (!current) { show("404: DISCONNECTED", "প্রজেক্টটি ডিলিট করা হয়েছে।"); return; }
                if (current.blocked) { show("403: BLOCKED", "প্রজেক্টটি ব্লক করা হয়েছে।"); return; }
                if (current.code !== lastCode) {
                    ov.style.display = "none";
                    frame.style.display = "block";
                    lastCode = current.code;
                    const d = frame.contentWindow.document;
                    d.open();
                    d.write(current.code.includes('viewport') ? current.code : '<meta name="viewport" content="width=device-width, initial-scale=1.0">'+current.code);
                    d.close();
                }
            } catch (e) { }
        }

        function show(t, m) { frame.style.display = "none"; ov.style.display = "flex"; ov.innerHTML = "<h1>"+t+"</h1><p>"+m+"</p>"; }
        setInterval(sync, 1000); sync();
    </script>
</body>
</html>
